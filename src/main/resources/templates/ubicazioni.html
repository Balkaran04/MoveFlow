<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ubicazioni</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>
<h1>Ubicazioni</h1>

<a style="padding-left: 10px" class="btn" href="/ubicazioni/inserimento">
  Nuova ubicazione
</a>
<p th:each="m : ${ubicazioni}"></p>

<table>
  <thead>
  <tr>
    <td>ID</td>
    <td>Altezza Massima</td>
    <td>Campata</td>
    <td>Codice</td>
    <td>Larghezza Massima</td>
    <td>Livello</td>
    <td>Peso Massimo</td>
    <td>Posizione</td>
    <td>Profondità Massima</td>
    <td>Stato</td>
    <td>Azioni</td>
  </tr>
  </thead>
  <tbody>
  <tr th:each="m : ${ubicazioni}">
    <td th:text="${m.id}"></td>
    <td th:text="${m.altezzaMassima}"></td>
    <td th:text="${m.campata}"></td>
    <td th:text="${m.codice}"></td>
    <td th:text="${m.larghezzaMassima}"></td>
    <td th:text="${m.livello}"></td>
    <td th:text="${m.pesoMassimo}"></td>
    <td th:text="${m.posizione}"></td>
    <td th:text="${m.profonditaMassima}"></td>
    <td th:text="${m.stato}"></td>
    <td class="actions">
      <form class="btn" method="POST" th:action="@{/ubicazioni/elimina/{id}(id=${m.id})}">
        <button type="submit">Elimina</button>
      </form>

      <a class="btn" th:href="@{/ubicazioni/modifica/{id}(id=${m.id})}">Modifica</a>

      <form class="btn" method="POST" th:if="${m.getStato().name() == 'LIBERA'}" th:action="@{/ubicazioni/blocca/{id}(id=${m.id})}">
        <button type="submit">Blocca</button>
      </form>
      <form class="btn" method="POST" th:if="${m.getStato().name() == 'BLOCCATA'}" th:action="@{/ubicazioni/sblocca/{id}(id=${m.id})}">
        <button type="submit">Sblocca</button>
      </form>
    </td>
  </tbody>


</table>

</body>
</html>
