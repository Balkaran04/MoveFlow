<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modifica Ubicazione</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>
<form
        method="POST"
        th:object="${ubicazione}"
        th:action="@{/ubicazioni/modifica/{id}(id=${ubicazione.id})}">

  <label>Altezza Massima: </label>
  <input type="text" step="0.01" th:field="*{altezzaMassima}">
  <br>

  <label>Campata: </label>
  <input type="text" th:field="*{campata}">
  <br>

  <label>Codice: </label>
  <input type="text" th:field="*{codice}">
  <br>

  <label>Larghezza Massima: </label>
  <input type="number" step="0.01" th:field="*{larghezzaMassima}">
  <br>

  <label>Livello: </label>
  <input type="number" th:field="*{livello}">
  <br>

  <label>Peso Massimo: </label>
  <input type="number" step="0.01" th:field="*{pesoMassimo}">
  <br>

  <label>Posizione: </label>
  <input type="number" th:field="*{posizione}">
  <br>

  <label>Profondità Massima: </label>
  <input type="number"  step="0.01" th:field="*{profonditaMassima}">
  <br>
  
  <button type="submit">Modifica Ubicazione</button>

</form>
</body>
</html>
